<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-grid"></div>
    <div class="background-blur"></div>

    <div class="theme-toggle" id="themeToggle">
        <div class="toggle-track">
            <div class="toggle-sun">☀️</div>
            <div class="toggle-moon">🌙</div>
            <div class="toggle-thumb"></div>
        </div>
    </div>

    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">J</div>
        <div class="user-name" id="userName">John Doe</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <button class="close-btn" onclick="closeWindow()">×</button>
            
            <div class="auth-header">
                <h2 id="authTitle">Welcome Back</h2>
                <p id="authSubtitle">Sign in to access the translator</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchWindow('signin')" id="signinTab">Sign In</button>
                <button class="auth-tab" onclick="switchWindow('signup')" id="signupTab">Sign Up</button>
            </div>

            <form class="auth-form" id="authForm" onsubmit="signUpAndSignIn(event)">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="emailInput" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="passwordInput" placeholder="Enter your password" required>
                </div>

                <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-input" id="confirmPasswordInput" placeholder="Confirm your password">
                </div>

                <div class="auth-actions">
                    <button type="submit" class="auth-btn" id="authSubmitBtn">Sign In</button>
                </div>

                <div class="forgot-link" id="forgotLink">
                    <a href="#" onclick="showForgotPassword()">Forgot your password?</a>
                </div>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Universal Translator</h1>
            <p>Break down language barriers with precision</p>
        </div>

        <div class="translator-interface">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">Source Text</div>
                    <div class="language-selector">
                        <select class="language-dropdown" id="inputLang">
                            <option value="auto">Auto Detect</option>
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="ru">Russian</option>
                            <option value="ja">Japanese</option>
                            <option value="ko">Korean</option>
                            <option value="zh">Chinese</option>
                            <option value="ar">Arabic</option>
                            <option value="hi">Hindi</option>
                        </select>
                    </div>
                </div>
                <div class="text-container">
                    <textarea 
                        class="text-area" 
                        id="inputText"
                        placeholder="Enter text to translate..."
                        maxlength="5000"
                    ></textarea>
                    <div class="word-count" id="wordCount">0 / 5000</div>
                    <button class="mic-btn" id="micBtn" title="Speech to text">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button class="image-btn" id="imageBtn" title="Upload image with text">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </button>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">Translation</div>
                    <div class="language-selector">
                        <select class="language-dropdown" id="outputLang">
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="ru">Russian</option>
                            <option value="ja">Japanese</option>
                            <option value="ko">Korean</option>
                            <option value="zh">Chinese</option>
                            <option value="ar">Arabic</option>
                            <option value="hi">Hindi</option>
                        </select>
                    </div>
                </div>
                <div class="text-container">
                    <textarea 
                        class="text-area output-area" 
                        id="outputText"
                        placeholder="Translation will appear here..."
                        readonly
                    ></textarea>
                    <button class="copy-btn" id="copyBtn" onclick="copyTranslation()">Copy</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="translateBtn" onclick="translateText()">
                Translate
            </button>
            <button class="btn btn-secondary" id="clearBtn" onclick="clearText()">
                Clear All
            </button>
            <button class="btn btn-info" id="historyBtn" onclick="showHistory()">
                📜 History
            </button>
            <button class="btn btn-info" id="savedBtn" onclick="showSaved()">
                ⭐ Saved
            </button>
        </div>

        <!-- Save button for current translation -->
        <button class="save-translation-btn" id="saveTranslationBtn" onclick="toggleSaveTranslation()" style="display: none;">
            <svg id="saveIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
        </button>
    </div>

    <!-- History Modal -->
    <div class="history-modal" id="historyModal" style="display: none;">
        <div class="history-content">
            <div class="history-header">
                <h2>Translation History</h2>
                <div>
                    <button class="btn-clear-history" onclick="clearHistory()">Clear All</button>
                    <button class="close-btn" onclick="closeHistory()">×</button>
                </div>
            </div>
            <div class="history-list" id="historyList">
                <div class="loading">Loading history...</div>
            </div>
            <div class="pagination" id="historyPagination"></div>
        </div>
    </div>

    <!-- Saved Translations Modal -->
    <div class="history-modal" id="savedModal" style="display: none;">
        <div class="history-content">
            <div class="history-header">
                <h2>Saved Translations</h2>
                <button class="close-btn" onclick="closeSaved()">×</button>
            </div>
            <div class="history-list" id="savedList">
                <div class="loading">Loading saved translations...</div>
            </div>
            <div class="pagination" id="savedPagination"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
